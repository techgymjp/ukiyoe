<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>浮世絵職人</title>
<meta name="description" content="絵師・彫師・摺師の工程をなぞって、一枚の錦絵（浮世絵）を摺り上げるWEBゲーム。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-screen="screen-title">
<header class="topbar">
  <button class="brand" id="btn-home" title="表題へ"><span class="brand-seal">浮</span><span class="brand-text">浮世絵職人</span></button>
  <div class="stagebar" id="stagebar"></div>
  <div class="top-actions">
    <button class="btn small" id="btn-gallery">画廊</button>
    <button class="btn small" id="btn-bgm" aria-pressed="true" title="BGM">♪<span class="hide-sm"> BGM</span></button>
    <button class="btn small" id="btn-sound" aria-pressed="true" title="効果音"><span class="hide-sm">効果</span>音</button>
  </div>
</header>

<main>
  <section id="screen-title" class="screen">
    <div class="hero">
      <h1><span>浮</span><span>世</span><span>絵</span><span>職</span><span>人</span></h1>
      <p class="lead">お手本を見て、<b>版を摺る順番</b>を見抜けるか。</p>
      <div class="start-btns">
        <button class="btn primary big" id="btn-start">はじめる</button>
        <button class="btn big" id="btn-continue" hidden>つづきから</button>
      </div>
      <p class="howto-link"><a class="btn" href="asobikata.html">遊び方</a></p>
    </div>
    <footer class="foot">作品はすべてメトロポリタン美術館が公開するパブリックドメイン（CC0）の原画を色分解して版にしています。</footer>
  </section>

  <section id="screen-work" class="screen">
    <div class="stage-wrap"><canvas id="cv"></canvas><div id="toast"></div></div>
    <aside id="panel" class="panel"></aside>
  </section>

  <section id="screen-gallery" class="screen">
    <div class="gal-head"><h2 class="sec">画廊</h2><button class="btn" id="btn-gallery-back">表題へ戻る</button></div>
    <div id="gallery-list" class="gallery"></div>
  </section>
</main>
<div id="viewer"><img alt="作品"></div>

<script src="js/util.js"></script>
<script src="js/designs.js"></script>
<script src="js/meisaku.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>
</body>
</html>
